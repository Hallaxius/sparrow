services:
  sparrow:
    build: .
    container_name: sparrow
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SPARROW_HOST_PORT:-8080}:${SPARROW_PORT:-8080}"
    environment:
      SPARROW_HOST: 0.0.0.0
      SPARROW_PORT: "${SPARROW_PORT:-8080}"
      SPARROW_ROUTING: fair
      SPARROW_API_KEY: "${SPARROW_API_KEY:?SPARROW_API_KEY must be set}"
      SPARROW_WARP_URL: "${SPARROW_WARP_URL:-socks5://host.docker.internal:1080}"
      SPARROW_WARP_REQUIRED: "${SPARROW_WARP_REQUIRED:-false}"
      WARP_HEALTH_INTERVAL: "60"
      WARP_CONNECT_TIMEOUT: "10"
      WARP_READ_TIMEOUT: "120"
      SPARROW_REQUEST_DEADLINE: "120"
      SPARROW_MAX_REQUEST_ATTEMPTS: "4"
      SPARROW_MAX_ROUTE_ATTEMPTS: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${SPARROW_PORT:-8080}/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
